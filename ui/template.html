/* Parag's ask (27 Oct): two tabs, one table per CE, one row per cluster, every source joined to the row.
   Type follows Oak's scale and nothing else: 18 title, 14 body and table, 12 secondary and labels, 10 group headers. */
:root{
  /* Oak (Eevee) semantic tokens. Surfaces: white / grey.1 #fafafa / grey.2 #f8f8f8 / grey.3 #f0f0f0; dividers grey.200 and
     grey.300; text grey.1–3; primary purps #8000ff, text purps.700, surface purps.20; status pairs are Oak's
     text.positive/surface.success.2, text.warning/surface.warning, text.destructive/surface.error.1. Intent pills use
     Oak's oceanblue (buying) and subtlegreen (planning) pairs. */
  --bg:#ffffff; --panel:#fafafa; --sunk:#f8f8f8; --page:#f0f0f0; --line:#e2e2e2; --line2:#f0f0f0;
  --fg:#222222; --fg2:#444444; --fg3:#666666; --fg4:#888888;
  --accent:#8000ff; --accent-ink:#6600cc; --accent-soft:#f3e9ff; --accent-faint:#f8f6ff;
  --ok:#078842; --ok-soft:#deffee; --warn:#9f6b00; --warn-soft:#fff8e5; --bad:#d60404; --bad-soft:#ffe5e5; --info:#02819c; --info-soft:#d6f8ff;
  --teal:#64732e; --teal-soft:#f4ffcc;
  --on-accent:#ffffff;
  --shadow-1:0 1px 6px 1px rgba(17,17,17,.10),0 1px 4px 0 rgba(17,17,17,.05);
  --overlay:rgba(0,0,0,.3); --overlay-dark:rgba(0,0,0,.5);
  --chart-1:#8000ff; --chart-2:#b266ff; --chart-3:#d9b3ff; --chart-4:#ecd9ff; --chart-5:#f8f6ff; --chart-alt:#ffbc00;
  --shadow-3:0 6px 16px 5px rgba(17,17,17,.10),0 1px 8px 0 rgba(17,17,17,.05);
  --font:halyard-text,"Halyard Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:halyard-display,"Halyard Display",halyard-text,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --t-title:18px; --t-body:14px; --t-small:12px; --t-tiny:10px;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--t-body);line-height:20px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;max-width:1480px;margin:0 auto}
.s{font-size:var(--t-small);line-height:16px;color:var(--fg3)}
.dim{color:var(--fg4)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:16px}
.title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.title h1{font-size:var(--t-title);line-height:24px;font-weight:600;margin:0}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--fg3);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tabs button small{font-size:var(--t-small);font-weight:var(--w-text);color:var(--fg4);margin-left:6px}

.pill{display:inline-flex;align-items:center;border-radius:20px;padding:2px 8px;font-size:var(--t-small);line-height:16px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--sunk);color:var(--fg3)}
.pill.line{border:1px solid var(--line);color:var(--fg3);font-weight:var(--w-text);padding:1px 8px}
.pill.todo{border:1px dashed var(--fg4);color:var(--fg2);background:transparent;font-weight:var(--w-text);padding:1px 8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:var(--t-small);line-height:16px;font-weight:500;color:var(--fg2);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-ink)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:6px 12px;font-size:var(--t-small);line-height:16px;font-weight:500;color:var(--fg3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.seg.mode button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button i,.chip i{font-style:normal;color:var(--fg4);margin-left:4px}
.seg button[aria-pressed="true"] i{color:inherit;opacity:.8}
.spacer{flex:1}
.toolbar select,.toolbar input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:var(--t-small);line-height:16px}
.toolbar input{width:200px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.chips>span{font-size:var(--t-small);color:var(--fg3);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 10px;font-size:var(--t-small);line-height:16px;color:var(--fg2)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:6px 12px;margin-bottom:8px;font-size:var(--t-small);font-weight:500}

.tbox{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 240px);min-height:320px}
table{border-collapse:separate;border-spacing:0;width:100%}
.tbl{min-width:100%}
th,td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top;text-align:left}
td{font-size:var(--t-body);line-height:20px}
td[data-cell]:hover{box-shadow:inset 0 0 0 1px var(--accent);cursor:zoom-in}
thead th{position:sticky;background:var(--panel);font-size:var(--t-small);line-height:16px;font-weight:500;color:var(--fg3);white-space:nowrap;z-index:3}
thead tr.g th{top:0;padding-bottom:6px;font-size:var(--t-tiny);line-height:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg4);border-bottom:0}
thead tr.g th .src{display:block;margin-top:2px;text-transform:none;letter-spacing:0;font-size:var(--t-small);line-height:16px;font-weight:var(--w-text)}
thead tr.h th{top:0;padding-top:6px;border-bottom:1px solid var(--line)}
th.gs,td.gs{border-left:1px solid var(--line2)}
th.sticky,td.sticky{position:sticky;left:0;background:var(--bg);min-width:280px;max-width:320px;box-shadow:1px 0 0 var(--line2);z-index:2}
thead th.sticky{z-index:4;background:var(--panel)}
tfoot td{position:sticky;bottom:0;background:var(--panel);font-weight:500;border-top:1px solid var(--line);z-index:2}
tfoot td.sticky{z-index:3;background:var(--panel)}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--sunk)}
tbody tr.sel td{background:var(--accent-soft)}
.cn{display:flex;gap:8px;align-items:flex-start}
.cn input{margin:3px 0 0}
.cn b{display:block;font-weight:500;white-space:normal}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:120px;max-width:240px}
.cell>span:first-child{white-space:nowrap}
.cell .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tip{display:inline-block;margin-left:4px;width:12px;height:12px;border-radius:50%;border:1px solid var(--fg4);color:var(--fg4);font-size:var(--t-tiny);line-height:10px;text-align:center;font-weight:600;cursor:help;vertical-align:0}
.est{color:var(--fg4);font-weight:var(--w-text)}
.prov{margin-top:8px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:var(--t-small);line-height:16px}
.prov b{font-weight:600}
.gh{display:inline-flex;align-items:center;gap:6px}
.gtog{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0 6px;font-size:var(--t-tiny);line-height:16px;font-weight:600;color:var(--accent-ink);letter-spacing:0}
.gtog:hover{border-color:var(--accent)}
th.folded{min-width:0;width:1%}
.foot{font-size:var(--t-small);line-height:16px;color:var(--fg3);margin:8px 0 0;max-width:120ch}

.unclaimed{margin-top:24px}
.unclaimed h2{font-size:var(--t-body);line-height:20px;font-weight:600;margin:0}
.unclaimed .lead{margin:2px 0 12px}
.unclaimed summary{cursor:pointer;list-style-position:outside}
.unclaimed summary h2{display:inline}
.ucols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ucard{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.ucard h3{font-size:var(--t-small);line-height:16px;font-weight:500;color:var(--fg3);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 0;border-top:1px solid var(--line2);align-items:start}
.urow .t{overflow-wrap:anywhere}
.urow select{grid-column:1/-1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 6px;font-size:var(--t-small);line-height:16px;color:var(--fg2);max-width:100%}

.empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--fg3);margin-top:16px}
.empty b{display:block;color:var(--fg);font-size:var(--t-body);margin-bottom:4px;font-weight:600}

.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(960px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow-3);padding:calc(16px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 20px}
.drawer header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer h2{margin:4px 0 0;font-size:var(--t-title);line-height:24px;font-weight:600}
.x{border:0;background:none;font-size:var(--t-title);color:var(--fg3);padding:0 4px;line-height:1}
.dbody{overflow-y:auto;flex:1;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.dbody>*{flex:none}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kvb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid transparent;background:var(--panel);border-radius:8px;padding:8px 10px;min-width:0}
.kvb:hover{border-color:var(--accent)}
.kvb .s{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kvb .v{font-size:var(--t-body);font-weight:600}
.kv div{background:var(--panel);border-radius:8px;padding:8px 10px;min-width:0}
.kv .v{font-weight:500;font-variant-numeric:tabular-nums}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:4px;overflow-x:auto}
.dtabs button{border:0;background:none;padding:8px 10px;border-bottom:2px solid transparent;color:var(--fg3);font-weight:500;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.dtabs button i{font-style:normal;font-weight:var(--w-text);color:var(--fg4);margin-left:6px;font-size:var(--t-small)}
.dsearch{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:var(--t-small);line-height:16px;width:100%}
.dfilters{display:flex;gap:6px;flex-wrap:wrap}
.dt{width:100%;border-collapse:collapse}
.dt th{position:static;background:none;text-align:left;font-size:var(--t-small);font-weight:500;color:var(--fg3);padding:6px 8px 6px 0;border-bottom:1px solid var(--line);white-space:normal;line-height:16px}
.dt td{overflow-wrap:anywhere}
.dt td.num,.dt th.num{white-space:nowrap;overflow-wrap:normal;padding-left:8px}
.dt .url{display:inline-block;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.dt td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line2);font-size:var(--t-small);line-height:16px;vertical-align:top}
.dt td:first-child{font-size:var(--t-body);line-height:20px}
.dt .num{text-align:right}
.dt .tags{margin-top:2px}
.dt tr.xrow{cursor:pointer}
.dt tr.xrow:hover td{background:var(--sunk)}
.dt tr.sub td{background:var(--panel);color:var(--fg2)}
.xcaret{display:inline-block;width:16px;color:var(--fg4)}
.ask{border:1px solid var(--line);border-radius:12px;padding:12px}
.ask.in{border-color:var(--accent)}
.preq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.preq select,.preq input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:var(--t-small);line-height:16px;min-width:0}
.preq .wide{grid-column:1/-1}
.ah{display:flex;gap:10px;align-items:flex-start}
.ab{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.at{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inc input{margin-top:3px}
.lnk{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:500;font-size:var(--t-small);text-align:left}
.pstat{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.pflow{border:1px solid var(--line2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ptiles>div{background:var(--panel);border-radius:8px;padding:8px 10px}
.ptiles>div.bad{background:var(--bad-soft)}.ptiles>div.bad .pv,.ptiles>div.bad .s{color:var(--bad)}
.ptiles>div.good{background:var(--ok-soft)}.ptiles>div.good .pv,.ptiles>div.good .s{color:var(--ok)}
.pv{font-size:var(--t-title);line-height:24px;font-weight:600;font-variant-numeric:tabular-nums}

.oppn{margin-left:8px;font-size:var(--t-small);color:var(--accent-ink);padding:0;border:0;background:none;cursor:pointer}.oppn:hover{text-decoration:underline}
.osplit{margin:0 0 10px}
.osec{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.ohead{display:flex;align-items:center;gap:10px}.ohead h3{margin:0;font-size:var(--t-body);font-weight:600}
.orule{margin:4px 0 8px}
.dt.ot td{vertical-align:middle}.dt.ot td.oc{width:220px}.dt.ot td.oact{width:170px;text-align:right;white-space:nowrap}.dt.ot td.oact .btn{margin-left:6px}
.btn.ghost{border-color:transparent;background:none;color:var(--fg3)}
.lback{position:fixed;inset:0;background:var(--overlay-dark);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.lbox{background:var(--bg);border-radius:12px;width:min(920px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 20px;box-shadow:var(--shadow-3)}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.lhead h2{margin:2px 0;font-size:18px}
.lgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:14px}
.lsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lstep{display:flex;gap:10px;padding:8px 10px;border-radius:8px}.lstep.cur{background:var(--accent-soft)}
.lico{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid var(--line);color:var(--fg3)}
.lstep.exists .lico,.lstep.done .lico{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}.lstep.ask .lico{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lopts{display:flex;gap:6px;margin-top:6px}
.lagent{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:var(--t-small);line-height:18px;background:var(--panel);max-height:420px;overflow:auto}.lagent p{margin:6px 0}
.lfoot{display:flex;gap:10px;align-items:center;margin-top:14px}
@media (max-width:700px){.lgrid{grid-template-columns:minmax(0,1fr)}}
.pgpop{padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.pgpop:hover{color:var(--accent-ink)}
.pprules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0;padding:10px 12px;background:var(--panel);border-radius:8px;font-size:var(--t-small)}
.agstack{display:flex;height:12px;border-radius:4px;overflow:hidden;margin:8px 0;background:var(--line2)}.agstack i{display:block;height:100%}
.agdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.dt .own{height:5px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:4px;max-width:160px}.dt .own i{display:block;height:100%;background:var(--accent)}
.agdet{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 0}.agl{display:flex;justify-content:space-between;gap:8px;font-size:var(--t-small);padding:3px 0;border-bottom:1px solid var(--line2)}
tr.kwfam{cursor:pointer}tr.kwfam:hover td{background:var(--sunk)}tr.kwchild td:first-child{padding-left:32px;font-size:var(--t-small)}
.banner{margin:0 0 12px;padding:8px 12px;border:1px solid var(--warn-soft);background:var(--warn-soft);color:var(--fg2);border-radius:8px;font-size:var(--t-small);line-height:18px}.banner b{color:var(--warn)}
.gtog{margin-left:6px;padding:0 6px;height:20px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent-ink);font-size:var(--t-tiny);font-weight:600;cursor:pointer;vertical-align:1px}
.gtog:hover{border-color:var(--accent)}.gtog[aria-expanded="true"]{color:var(--fg3)}
.cell.num{align-items:flex-end;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:60;font-size:var(--t-small);max-width:calc(100% - 32px)}
@media (max-width:900px){.ucols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  th.sticky,td.sticky{min-width:170px;max-width:190px}
  .toolbar input{width:100%}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* Krupa's cues, in Oak: seed chips by bucket, launch plan, product mismatch, intent chips. */
.seedgrp{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.chip.seed{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px}.chip.seed i{font-style:normal;color:var(--fg4)}
.x.sm{width:24px;height:24px}.x.sm .ic{width:14px;height:14px}
.plan{border:1px solid var(--line2);border-radius:12px;padding:12px 16px;margin:12px 0}.plan ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
tr.mismatch td{background:var(--warn-soft)}
.chips.intent{margin:0}
.gtog{height:24px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:12px;font-weight:500}
.gtog:hover{border-color:var(--fg)}.gtog[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-faint);color:var(--accent-ink)}
/* Send panel and the record of what was sent. */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks .ck{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.checks li.ok .ck{background:var(--ok-soft);color:var(--ok)}.checks li.no .ck{background:var(--bad-soft);color:var(--bad)}.checks li.warn .ck{background:var(--warn-soft);color:var(--warn)}
.sentbar{margin:12px 0 0;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Gate 1 review flags: Oak warning pair. */
.pill.flag{background:var(--warn-soft);color:var(--warn)}
.flagbox{border-radius:12px;background:var(--warn-soft);padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.flagbox>b{font-size:12px;color:var(--warn)}
.flagbox .flag{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--fg);font-weight:300;margin:0}
.flagacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flagbox .flag.kept{opacity:.65}
.btn.sm{padding:3px 10px;font-size:12px;line-height:16px}
/* Visual pass in Oak (Eevee): Krupa's layout cues (grey ground, cards, intent pills, size bars, coloured decisions,
   monospace URLs) drawn only with Oak tokens. Radii: 4 for tags, 8 for controls, 12 for cards. Shadows: level 1 for
   cards, level 3 for the side panel. Type: heading.regular title, cta.small buttons, tags.regular pills. */
body{background:var(--page)}
.top{background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 1px 0 var(--line)}
.title h1{font-family:var(--font-display);font-size:18px;line-height:24px;font-weight:600}
.tbox{background:var(--bg);border:0;border-radius:12px;box-shadow:var(--shadow-1)}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tiles>div{background:var(--bg);border:0;border-radius:12px;box-shadow:var(--shadow-1);padding:10px 12px}
.tiles>div b{font-size:18px;line-height:24px}
.cebadge{font-size:12px;line-height:16px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:2px 8px}
th,td{padding:12px 12px}
.pill{border-radius:4px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.2px;padding:2px 8px}
.pill.it-transactional{background:var(--info-soft);color:var(--info)}
.pill.it-planning{background:var(--teal-soft);color:var(--teal)}
.pill.it-informational{background:var(--sunk);color:var(--fg3);box-shadow:inset 0 0 0 1px var(--line)}
.pill.ask{background:var(--accent-soft);color:var(--accent-ink)}
.btn{border-radius:8px;font-size:14px;line-height:20px;font-weight:500;padding:6px 14px;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:not(.primary):hover:not(:disabled){background:var(--accent-faint);border-color:var(--accent-soft)}
.seg{border-radius:8px}.seg button{font-size:14px;line-height:20px;padding:6px 14px}
.chip{font-size:14px;line-height:20px;padding:5px 12px}
.isel{border-radius:8px}
.isel.sup-covered,.isel.conf-yes{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:500}
.isel.sup-coming{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:500}
.isel.sup-none{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:500}
.isel.conf-no{background:var(--sunk);color:var(--fg2);border-color:transparent}
.pgp,.pgpop,.url,.urlin{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.drawer{box-shadow:var(--shadow-3);border-left:0}
.banner{border-radius:8px}

/* Eevee components, matched in a static page (Oak tokens only):
   Button: primary = purps fill, secondary = 1px grey.900 outline, tertiary = purps.20 fill with purps.700 text; radius 8.
   Dropdown: 1px dividers.dark border, radius 8, Onix ChevronDown. Checkbox: 16px, radius 4, purps when checked, Onix
   Checkmark. Filters chip: 1px border, radius 8, applied = purps border on purps.10. Toast: grey.900, white, radius 8.
   Type: Halyard Text (Eevee's system fallback where it can't load), para/table weight 300, labels 500, headings 600.
   Oak has no monospace font, so URLs use the body face. */
body{font-weight:300}
b,strong,h1,h2,h3,h4,th,.btn,.chip,.seg button,.pill,label,summary{font-weight:500}
h1,h2,.xh h2,.title h1{font-weight:600}
.pgp,.pgpop,.url,.urlin,.pglink{font-family:var(--font);font-size:14px}
a.pglink{color:inherit;text-decoration:underline dotted;text-underline-offset:3px}a.pglink:hover{color:var(--accent-ink)}
.ic{display:inline-flex;width:1em;height:1em;vertical-align:-.15em}.ic svg,.tip svg{width:100%;height:100%}
.tip{border:0;width:14px;height:14px;color:var(--fg4);vertical-align:-2px}
.btn{background:var(--bg);border:1px solid var(--fg);color:var(--fg);border-radius:8px}
.btn:not(.primary):hover:not(:disabled){background:var(--sunk);border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm:not(.primary),.lnk.btnlike{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
.btn.sm:not(.primary):hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
select.isel,.toolbar select{-webkit-appearance:none;appearance:none;background:var(--bg) url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M3%206L7.11612%2010.1161C7.53278%2010.5328%207.74112%2010.7411%208%2010.7411C8.25888%2010.7411%208.46722%2010.5328%208.88388%2010.1161L13%206%22%20stroke%3D%22%23444444%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3C/path%3E%3C/svg%3E") no-repeat right 8px center/14px;border:1px solid var(--line);border-radius:8px;padding:6px 32px 6px 10px;font-size:14px;line-height:20px;font-weight:300}
select.isel.mini{padding:2px 24px 2px 8px;font-size:12px;background-size:12px}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:16px;height:16px;border:1px solid var(--fg3);border-radius:4px;background:var(--bg);display:inline-grid;place-content:center;cursor:pointer;flex:none}
input[type=checkbox]:checked{background:var(--accent) url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M3.33337%209.33334L5.66671%2011.6667L12.6667%204.33334%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3C/path%3E%3C/svg%3E") no-repeat center/12px;border-color:var(--accent)}
input[type=search],input:not([type]),.urlin,.addrow input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:300}
.chip{border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-faint);color:var(--accent-ink)}
.toast{background:var(--fg);color:var(--on-accent);border-radius:8px;box-shadow:var(--shadow-1);font-size:14px;font-weight:300;padding:12px 16px}
.x{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;color:var(--fg2)}.x:hover{background:var(--sunk)}.x .ic{width:18px;height:18px}

/* Only the slim bar (title, view switch, actions) stays pinned; the tiles scroll away, and the table box fills the
   window below the bar once reached, with its own sticky column headers. --bar is the bar's measured height. */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:8px}
.top .hrow{flex-wrap:wrap;row-gap:8px}.top .title{flex:none}
.cesub{display:block;margin:12px 0 0}
.tbox{max-height:calc(100vh - var(--bar,64px) - 16px);min-height:480px}

.kwedit{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:var(--accent-faint)}
/* Segmented switch (Krupa's, in Oak): grey.3 track, radius 12; the selected option is a white card with shadow level 1. */
.seg{display:inline-flex;gap:4px;padding:4px;border:0;border-radius:12px;background:var(--page);overflow:visible}
.seg button,.seg button:last-child{border:0;border-radius:8px;background:transparent;color:var(--fg3);padding:6px 16px;font-size:14px;line-height:20px;font-weight:500}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"],.seg.mode button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:var(--shadow-1)}

/* Panel header and keyword editing. */
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--fg3);font-size:16px}
.ib:hover{background:var(--accent-faint);color:var(--accent-ink)}.ib .ic{width:16px;height:16px}
h2 .ib{vertical-align:middle;margin-left:4px}
.pillsel{-webkit-appearance:none;appearance:none;border:0;border-radius:4px;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;cursor:pointer}
.pillsel.it-transactional{background:var(--info-soft);color:var(--info)}.pillsel.it-planning{background:var(--teal-soft);color:var(--teal)}.pillsel.it-informational{background:var(--sunk);color:var(--fg3)}
.kv{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tabstat{margin:0 0 8px;font-size:14px;color:var(--fg2)}
.kwhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kwt td.ck,.kwt th.ck{width:28px;padding-right:0}.kwt td.kwacts{white-space:nowrap;text-align:right;width:1%}
.kwt tr.sel td{background:var(--accent-faint)}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:var(--accent-soft);margin:8px 0}
.toastundo{margin-left:12px;border:0;background:transparent;color:var(--on-accent);font-weight:500;text-decoration:underline;cursor:pointer}

/* Add keyword suggestions (Eevee Dropdown look): white list, shadow level 1, radius 8. */
.kwaddwrap{position:relative;min-width:320px}
.kwsuglist{position:absolute;right:0;top:100%;z-index:5;margin:4px 0 0;padding:4px;list-style:none;width:min(440px,90vw);background:var(--bg);border-radius:8px;box-shadow:var(--shadow-1)}
.kwsuglist button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:300;color:var(--fg)}
.kwsuglist button:hover,.kwsuglist button:focus-visible{background:var(--accent-faint)}
.kwsuglist li:last-child button{border-top:1px solid var(--line2);border-radius:0 0 8px 8px}

/* Perf ask cell: the instruction in bold, one line of why, small actions. Empty rows show "+ Ask Perf" only on hover. */
.cell.ask{white-space:normal;border:0;padding:0;border-radius:0}
.askacts{display:flex;gap:8px;align-items:center;margin-top:6px}
select.isel.more{width:36px;padding:2px 6px;background-image:none;text-align:center}
.askok{display:inline-flex;gap:4px;align-items:center;color:var(--ok)}.askok svg{width:14px;height:14px}

.thtab td:last-child{text-align:right;white-space:nowrap}.thin{display:inline-flex;align-items:center;gap:4px}.thin input{width:88px;text-align:right}

.wrap{max-width:none;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.top{margin:0 calc(-1 * max(32px,env(safe-area-inset-left,0px)));padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.tbl td.sticky,.tbl th.sticky{box-shadow:4px 0 6px -4px rgba(17,17,17,.10)}
.cell .s{white-space:normal}

.fkw{display:inline-block;min-width:160px;max-width:220px}
.askrow{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%}
.askrow .askacts{margin-top:0;flex:none}

select.isel.more:hover{background:var(--sunk)}

.tbl tbody tr.row.todo td.sticky{box-shadow:inset 3px 0 0 var(--accent),4px 0 6px -4px rgba(17,17,17,.10)}


/* One type scale (Oak text styles, internal-tool sizes from headout/design-skills). Halyard falls back to the system
   face here, where 300 reads too thin, so rows use 400 (see below).
   title / section 18/24 600 · table rows 14/20 (Oak table.small is 14/16; 20 keeps two-line cells apart), emphasis 500 · buttons, chips, toggles 14/20 500 ·
   body outside the table 14/20 400 · secondary and captions 12/16 400 · labels, tags, column headers 12/16 500 */
.title h1,h1{font-family:var(--font);font-size:18px;line-height:24px;font-weight:600}
h2,.xh h2,.unclaimed h2,.drawer h2{font-size:18px;line-height:24px;font-weight:600}
h4.sh{font-size:14px;line-height:20px;font-weight:600}
.s,.tbl tbody td .s,.cell .s,.tiles .s,.cesub,.pgn{font-size:12px;line-height:16px;font-weight:var(--w-text)}
.btn,.chip,.seg button,.seg button[aria-pressed="true"],.seg.mode button[aria-pressed="true"]{font-size:14px;line-height:20px;font-weight:500}
.pill,.cebadge,.gtog,summary,.lnk.s{font-size:12px;line-height:16px;font-weight:500}
.tip{font-size:0}
.tiles b{font-size:18px;line-height:24px;font-weight:600}

/* Side panel on the same scale: body and tables 14/20 400, captions 12/16 400, chart labels 10/12 500. */
.drawer .dt td,.drawer .dt th,.tabstat,.drawer .dbody>p,.drawer li{font-size:14px;line-height:20px;font-weight:var(--w-text)}
.drawer .dt th{font-weight:500}
.drawer .legend span,.drawer .leg span{font-size:12px;line-height:16px;font-weight:var(--w-text)}
.drawer svg text,.drawer em,.drawer .wk i,.drawer .bars i{font-size:10px;line-height:12px;font-weight:500;font-style:normal}
/* Main clusters table (.ctbl), one rule per property; checked against Oak text styles and tokens.
   Fixed layout with a colgroup so the set widths hold. Cells align to the top and every first line is a 24px slot:
   text sits 2px lower (14px top padding) and 24px controls lift 2px, so text and controls share one line.
   Styles: values 14/20 400 grey.1 (Oak has no 400; the system font is too thin at 300), names 14/20 500, secondary
   lines 12/16 400 grey.700, text actions 12/16 500 purps.700, controls 24px at 12/16 500, pills 12/16 500. */
.ctbl{table-layout:fixed;width:100%;min-width:0}
.tbl th,.tbl td{vertical-align:top}
.tbl thead th{font-size:12px;line-height:16px;font-weight:500;color:var(--fg3);background:var(--bg);text-transform:none;letter-spacing:0;white-space:nowrap;text-align:left}
.tbl thead tr.g th{top:0;height:36px;box-sizing:border-box;padding:12px 16px 0;border-bottom:0;color:var(--fg);overflow:visible}
.tbl thead tr.g th.num{text-align:right}
.tbl thead tr.g th.num .gh{position:absolute;right:16px;top:12px;white-space:nowrap}
.tbl thead tr.h th{padding:4px 16px 12px;border-bottom:1px solid var(--line)}
.tbl thead tr.g+tr.h th{top:36px}
.tbl thead th .cnt{font-weight:var(--w-text);color:var(--fg4);margin-left:6px}
.tbl thead th .gtog{margin-left:6px;height:24px;padding:0 8px;vertical-align:middle}

:root{--accent-soft2:#ecd9ff;--accent-deep:#330066;--shadow-2:0 4px 12px 2px rgba(17,17,17,.10),0 1px 8px 0 rgba(17,17,17,.05);--teal-soft:#f9ffe5}
/* Oak Filters chip selector (small): pill radius, ui.label.regular.heavy 14/16 500, text grey.2, border dividers.dark;

.chip,.gtog{border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--fg2);font-size:14px;line-height:16px;font-weight:500;padding:6px 12px}

.tbl th.gs,.tbl td.gs{border-left:0}
/* Oak focus ring: 2px white then 1px surface.dark.primary.2. */

/* Agree: Oak Button small, tertiary, primary colours; hover surface.light.primary.2. Kept at 24px in the table (compact). */

.omenu-chip:hover{border-color:var(--fg2)}.omenu-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.omenu-chip svg{width:12px;height:12px}

function signal(c){
  if(OTHER(c))return null;
  if(whiteSpace(c))return'Build ad group';
  if(!TR(c)&&(c.clicks||0)<100)return'No paid';
  if((c.spend||0)>=500&&c.roi!=null&&c.roi<1)return'Fix or cut';
  if((c.spend||0)>=500&&c.roi>=1.4&&(c.lost||0)>.5)return'Bid up';
  if((c.spend||0)>=1000&&(c.catchall||0)>.8)return'Split out';
  if(c.roi>=1.4&&(c.sis||0)>.6)return'Protect';

}

/* ---------- Read-only notes on a cluster's paid state, for the BGM. Perf decides what to do in their own tool. ---------- */
function notes(c){
  const P=DR.clusters[c.id]?.perf; if(!P||OTHER(c)||!HASPAID)return[];
  const N=[];
  if(c.target!=='Not'&&(P.untargeted_clicks||0)>=50)N.push(`${n(P.untargeted_clicks)} paid clicks came from ${n(P.untargeted.length)}+ searches no keyword targets, e.g. ${P.untargeted.slice(0,3).map(t=>'"'+t.term+'"').join(', ')}.`);
  if(c.target==='Not'&&(c.clicks||0)>=100)N.push(`No keyword targets it, yet ${n(c.clicks)} clicks arrive through AI Max or broad match.`);
  if((c.theme?.focus??1)<.1&&(c.spend||0)>=1000)N.push(`It rides the ${c.theme.top} theme (only ${pct(c.theme.focus)} of its clicks), so its ads and landing page are written for other intents.`);
  const lpg=c.land?.pages?.[0];
  if(lpg&&isHome(lpg.path)&&lpg.share>=.4&&c.pages.length&&!HEAD(c))N.push(`${pct(lpg.share)} of its paid clicks land on the home page although it has its own page (${esc(pathOf(c.pages[0]))}).`);
  if(P.negatives?.length)N.push(`${usd(P.negatives_spend)} of spend in its ad groups goes to searches that belong to other clusters.`);
  if(c.roi!=null&&(c.spend||0)>=500&&c.roi<1)N.push(`Paid ROI ${pct(c.roi)} on ${usd(c.spend)} spend: it loses money.`);
  return N;
}

// Under these floors a cluster's or search's rate is noise: ROI, CVR and RPC need 100 paid clicks, organic needs 10 clicks.
const PAID_FLOOR=100, ORG_FLOOR=10;
// Mixpanel records no locale home page (/de/, /es/…), so their LP2S cannot be known.
const isLocaleHome=p=>/^\/[a-z]{2}(-[a-z]{2})?\/?$/.test(String(p||''));
// Campaign and ad group names shortened to what tells them apart: "Milford Sound - Milford Sound Cruise - English - All -
// Search - All - All - cid3945" → "Milford Sound Cruise · English"; "Generic - Exact - English - Cruise" → "Cruise · English · Exact".
const campShort=v=>{const p=String(v||'').split(' - ').filter(w=>!/^(All|Search|cid\d+)$/i.test(w.trim()));return (p.length>2?p.slice(1):p).join(' · ')||String(v||'')};
const agShort=v=>{const p=String(v||'').split(' - ');return p.length>=3&&/^(Exact|Broad|Phrase)$/i.test(p[1])?`${p.slice(3).join(' ')||'All'} · ${p[2]} · ${p[1]}`:String(v||'')};
// The ROI target of the campaigns serving a cluster, weighted by its clicks in each. Campaigns on the "Existing" portfolio
// bid to that portfolio's 155%.
const PORTFOLIO_TARGET={Existing:1.55};
const campTarget=k=>k.troas||PORTFOLIO_TARGET[k.portfolio]||null;
function targetOf(x){const L=(x.campaigns||[]).filter(k=>campTarget(k)), w=L.reduce((a,k)=>a+k.clicks,0);return w?L.reduce((a,k)=>a+campTarget(k)*k.clicks,0)/w:null}
const sparkSvg=(vals,col)=>{const m=Math.max(1e-9,...vals);return vals.length>1?`<svg class="dspark" viewBox="0 0 150 30" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" points="${vals.map((v,i)=>`${(i*150/(vals.length-1)).toFixed(1)},${(28-26*(v||0)/m).toFixed(1)}`).join(' ')}"/></svg>`:''};
/* The three decisions a cluster needs, in the order they unblock each other: Supply, Own page, Perf ask. The same cells as
   the table, so a decision taken here is the table's. The first one still open is marked. */

}

/* Undo never erases history: the entry is marked undone and a reversal entry is added. When the change already went out

function undoEntry(x){if(!x||!x.undo||x.undone)return;const k=S.sends.findIndex(sd=>sd.at>=x.at), sent=k>=0?k+1:0;x.undo();x.undone=true;
  logChange(`Undid: ${x.text}${sent?` · was in Send #${sent}; Perf and content see the undo at the next send`:''}`);

const STATE_KEY='clusters-state-'+D.ce.id;
const KEEP=['sep','ask','supply','oppState','assign','flagOk','reviewed','moves','merged','deleted','names','intents','ptype','slug','subd','subdUrl',
  'sends','sentContent','sentPerf','sentSig','lastSnap','lstate','contentCall','leave','leaveSug','kwAdd','focusOk','focusWas','sepOk','th','pageMap',
  'pmap','uncAssign','pstat','perfPick','seeds','mergeOps','perfMark','hold','L','perfAt','contentAt','oppSent','ent'];
const SETS=new Set(['sentContent','sentPerf','leaveSug']);
const normName=v=>String(v||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
let saveT=null;
function saveState(){clearTimeout(saveT);saveT=setTimeout(()=>{try{const o={v:1,saved:new Date().toISOString()};
  KEEP.forEach(k=>{const v=S[k];if(v!==undefined&&v!==null)o[k]=SETS.has(k)?[...v]:v});
  o.focusNow=Object.fromEntries(Object.keys(S.focusWas||{}).map(id=>[id,{focus_kw:byId[id]?.focus_kw,vol:byId[id]?.vol}]).filter(([id])=>byId[id]));
  o.log=S.log.slice(0,300).map(x=>({text:x.text,at:x.at,seed:!!x.seed,undone:!!x.undone}));
  o.idName=Object.fromEntries(C.map(c=>[c.id,normName(c.name)]));
  localStorage.setItem(STATE_KEY,JSON.stringify(o))}catch(e){}},300)}
function loadState(){let o;try{o=JSON.parse(localStorage.getItem(STATE_KEY)||'null')}catch(e){o=null}if(!o||o.v!==1)return;
  // A re-run can issue new cluster ids (the pipeline's ids come from the cluster name; the earlier set's did not). Saved
  // decisions follow a cluster whose name is unchanged: every old id is swapped for the id of the cluster with that name.
  const nowBy=new Map();C.forEach(c=>{const k=normName(c.name);nowBy.set(k,nowBy.has(k)?null:c.id)});
  const swap=Object.entries(o.idName||{}).filter(([id,nmv])=>!byId[id]&&nowBy.get(nmv));
  if(swap.length){let txt=JSON.stringify(o);swap.forEach(([id,nmv])=>{txt=txt.split(id).join(nowBy.get(nmv))});o=JSON.parse(txt);S.carried=swap.length}
  S.replaying=true;
  try{Object.entries(o.focusNow||{}).forEach(([id,f])=>{if(byId[id]&&f.focus_kw){byId[id].focus_kw=f.focus_kw;byId[id].vol=f.vol}});
    Object.entries(o.pageMap||{}).forEach(([i,v])=>{const x=noClusterPages().find(y=>y.i===i);if(x&&byId[v])byId[v].pages.push({path:x.path,type:x.type,revenue:x.revenue,how:'content'})});
    (o.mergeOps||[]).forEach(ids=>{const L=ids.map(id=>byId[id]).filter(Boolean);if(L.length>1)mergeClusters(L)});
  }catch(e){}
  KEEP.forEach(k=>{if(k in o)S[k]=SETS.has(k)?new Set(o[k]):o[k]});
  const day=v=>v?new Date(v):v;
  (S.sends||[]).forEach(x=>{x.at=day(x.at)});if(S.reviewed)S.reviewed.at=day(S.reviewed.at);
  S.log=(o.log||[]).map(x=>({...x,at:day(x.at)}));
  S.replaying=false;S.restored=o.saved}
function clearSaved(){try{localStorage.removeItem(STATE_KEY)}catch(e){}location.reload()}
// A CE with no buying clusters opens on every intent rather than an empty table.
if(!live().some(c=>typeOf(c)==='TRANSACTIONAL'))S.types.clear();
loadState();
// The launch agent is simulated in this page, so a launch cut off by a reload finishes on load.
Object.keys(S.lstate).forEach(id=>{if(S.lstate[id]==='queued')S.lstate[id]='launched'});
render();
if(S.carried)toast(`Your decisions on ${n(S.carried)} cluster${S.carried===1?'':'s'} carried over to this run by name.`);
</script>
